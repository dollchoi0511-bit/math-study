<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>수학 수업 3분 마무리 체크 & 실시간 교사 피드백 대시보드</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM (v18) CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js" crossorigin></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel Standalone (JSX 컴파일용) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.6/babel.min.js"></script>

  <!-- Firebase v10 Compat SDK (App, Auth, Firestore) -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700;800&display=swap');
    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fadeIn {
      animation: fadeIn 0.25s ease-out forwards;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    // =========================================================================
    // 👇 [1] Firebase 콘솔에서 복사한 설정을 여기에 그대로 붙여넣으세요!
    // =========================================================================
    const firebaseConfig = {
      apiKey: "...",
      authDomain: "...",
      projectId: "...",
      storageBucket: "...",
      messagingSenderId: "...",
      appId: "..."
    };
    // =========================================================================

    const { useState, useEffect, useMemo, useRef } = React;

    // --- 자체 내장 SVG 아이콘 컴포넌트 ---
    const IconGraduation = () => (
      <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <path d="M22 10v6M2 10l10-5 10 5-10 5z"></path>
        <path d="M6 12v5c3 3 9 3 12 0v-5"></path>
      </svg>
    );
    const IconUsers = () => (
      <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
        <circle cx="9" cy="7" r="4"></circle>
        <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
        <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
      </svg>
    );
    const IconChart = () => (
      <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <line x1="18" y1="20" x2="18" y2="10"></line>
        <line x1="12" y1="20" x2="12" y2="4"></line>
        <line x1="6" y1="20" x2="6" y2="14"></line>
      </svg>
    );
    const IconClock = () => (
      <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <circle cx="12" cy="12" r="10"></circle>
        <polyline points="12 6 12 12 16 14"></polyline>
      </svg>
    );
    const IconCheck = ({ className = "w-4 h-4" }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
        <polyline points="20 6 9 17 4 12"></polyline>
      </svg>
    );
    const IconCheckCircle = () => (
      <svg className="w-12 h-12" fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
        <polyline points="22 4 12 14.01 9 11.01"></polyline>
      </svg>
    );
    const IconX = ({ className = "w-4 h-4" }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    );
    const IconSend = () => (
      <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <line x1="22" y1="2" x2="11" y2="13"></line>
        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
      </svg>
    );
    const IconSparkles = () => (
      <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"></path>
      </svg>
    );
    const IconRefresh = () => (
      <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"></path>
      </svg>
    );
    const IconEdit = () => (
      <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"></path>
      </svg>
    );
    const IconMessage = () => (
      <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
      </svg>
    );
    const IconUserX = () => (
      <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
        <circle cx="8.5" cy="7" r="4"></circle>
        <line x1="18" y1="8" x2="23" y2="13"></line>
        <line x1="23" y1="8" x2="18" y2="13"></line>
      </svg>
    );
    const IconTrending = () => (
      <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <polyline points="23 6 13.5 15.5 8.5 10.5 1 18"></polyline>
        <polyline points="17 6 23 6 23 12"></polyline>
      </svg>
    );
    const IconDatabase = () => (
      <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <ellipse cx="12" cy="5" rx="9" ry="3"></ellipse>
        <path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"></path>
        <path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"></path>
      </svg>
    );

    // 기본 수학 문제 템플릿
    const DEFAULT_QUIZ = {
      question: "일차방정식 2x + 6 = 16 을 만족하는 x의 값은 무엇일까요?",
      options: [
        { id: 1, text: "x = 3" },
        { id: 2, text: "x = 5" },
        { id: 3, text: "x = 7" },
        { id: 4, text: "x = 10" }
      ],
      correctOptionId: 2,
      explanation: "양변에서 6을 빼면 2x = 10이 되고, 양변을 2로 나누면 x = 5가 됩니다."
    };

    function App() {
      const [activeTab, setActiveTab] = useState('student'); // 'student' | 'teacher'
      const [responses, setResponses] = useState([]);
      const [quizConfig, setQuizConfig] = useState(DEFAULT_QUIZ);
      const [isEditingQuiz, setIsEditingQuiz] = useState(false);
      const [editForm, setEditForm] = useState(DEFAULT_QUIZ);
      const [isSubmitting, setIsSubmitting] = useState(false);
      const [submitted, setSubmitted] = useState(false);
      const [filterUnderstanding, setFilterUnderstanding] = useState('all');
      
      // Firebase 연결 상태
      const [dbStatus, setDbStatus] = useState('checking'); // 'connected' | 'offline'

      // 학생 폼 입력 상태
      const [studentId, setStudentId] = useState('');
      const [studentName, setStudentName] = useState('');
      const [understanding, setUnderstanding] = useState(''); // 'high', 'medium', 'low'
      const [selectedAnswer, setSelectedAnswer] = useState(null);
      const [confusingTopic, setConfusingTopic] = useState('');
      const [statusMessage, setStatusMessage] = useState({ type: '', text: '' });

      // Firebase 초기화 및 실시간 데이터 바인딩
      useEffect(() => {
        let isConfigValid = false;
        
        // 환경 변수 또는 직접 입력된 firebaseConfig 검사
        let targetConfig = firebaseConfig;
        if (typeof __firebase_config !== 'undefined') {
          try {
            targetConfig = JSON.parse(__firebase_config);
          } catch(e) {}
        }

        if (targetConfig && targetConfig.apiKey && targetConfig.apiKey !== "..." && targetConfig.apiKey !== "YOUR_API_KEY") {
          isConfigValid = true;
        }

        if (isConfigValid) {
          try {
            if (firebase.apps.length === 0) {
              firebase.initializeApp(targetConfig);
            }
            
            const auth = firebase.auth();
            const db = firebase.firestore();

            // 익명 로그인 시도 (Firebase 콘솔에서 익명 인증 켜기 필요)
            auth.signInAnonymously().catch((err) => {
              console.warn("익명 인증 알림 (규칙에 따라 인증 없이도 작동 가능):", err.message);
            });

            // 1. 학생 응답 컬렉션 실시간 구독
            const unsubResponses = db.collection('math_exit_tickets')
              .onSnapshot(
                (snapshot) => {
                  const list = [];
                  snapshot.forEach((doc) => list.push({ id: doc.id, ...doc.data() }));
                  setResponses(list);
                  setDbStatus('connected');
                },
                (err) => {
                  console.warn("Firestore 실시간 읽기 오류 (로컬 모드로 전환):", err);
                  setDbStatus('offline');
                }
              );

            // 2. 퀴즈 설정 실시간 구독
            const unsubQuiz = db.collection('math_quiz_settings').doc('current')
              .onSnapshot(
                (doc) => {
                  if (doc.exists && doc.data()?.question) {
                    setQuizConfig(doc.data());
                    setEditForm(doc.data());
                  }
                },
                (err) => console.log("퀴즈 설정 로드 건너뜀:", err)
              );

            return () => {
              unsubResponses();
              unsubQuiz();
            };
          } catch (err) {
            console.error("Firebase 초기화 에러:", err);
            setDbStatus('offline');
          }
        } else {
          // Firebase 설정 전: 로컬 메모리 모드로 정상 작동
          setDbStatus('offline');
        }
      }, []);

      // 학생 응답 제출
      const handleSubmitResponse = async (e) => {
        e.preventDefault();
        if (!studentId.trim() || !studentName.trim()) {
          setStatusMessage({ type: 'error', text: '학번과 이름을 모두 입력해주세요.' });
          return;
        }
        if (!understanding) {
          setStatusMessage({ type: 'error', text: '오늘 배운 내용의 이해도를 선택해주세요.' });
          return;
        }
        if (selectedAnswer === null) {
          setStatusMessage({ type: 'error', text: '확인 문제의 정답을 선택해주세요.' });
          return;
        }

        setIsSubmitting(true);
        setStatusMessage({ type: '', text: '' });

        const newResponse = {
          studentId: studentId.trim(),
          studentName: studentName.trim(),
          understanding,
          selectedAnswer,
          isCorrect: selectedAnswer === quizConfig.correctOptionId,
          confusingTopic: confusingTopic.trim(),
          submittedAt: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
          timestamp: Date.now()
        };

        if (dbStatus === 'connected' && firebase.apps.length > 0) {
          try {
            const db = firebase.firestore();
            await db.collection('math_exit_tickets').add(newResponse);
            setSubmitted(true);
          } catch (err) {
            console.error("Firebase 저장 실패, 로컬 저장 전환:", err);
            setResponses((prev) => [
              ...prev.filter((r) => r.studentId !== newResponse.studentId),
              { id: 'local-' + Date.now(), ...newResponse }
            ]);
            setSubmitted(true);
          }
        } else {
          // 로컬 모드 저장
          setResponses((prev) => [
            ...prev.filter((r) => r.studentId !== newResponse.studentId),
            { id: 'local-' + Date.now(), ...newResponse }
          ]);
          setSubmitted(true);
        }
        setIsSubmitting(false);
      };

      // 재작성 모드
      const handleResetForm = () => {
        setSubmitted(false);
        setUnderstanding('');
        setSelectedAnswer(null);
        setConfusingTopic('');
        setStatusMessage({ type: '', text: '' });
      };

      // 교사: 문제 설정 저장
      const handleSaveQuiz = async (e) => {
        e.preventDefault();
        if (dbStatus === 'connected' && firebase.apps.length > 0) {
          try {
            const db = firebase.firestore();
            await db.collection('math_quiz_settings').doc('current').set(editForm);
          } catch (err) {
            console.error("퀴즈 저장 오류:", err);
          }
        }
        setQuizConfig(editForm);
        setIsEditingQuiz(false);
      };

      // 교사: 연수 실습용 10명 가상 학생 데이터 생성
      const handleGenerateSampleData = async () => {
        const sampleStudents = [
          { studentId: "10101", studentName: "김민수", understanding: "high", selectedAnswer: quizConfig.correctOptionId, confusingTopic: "마지막 단계에서 2로 나누는 부분 계산이 살짝 빨랐어요." },
          { studentId: "10102", studentName: "이서연", understanding: "high", selectedAnswer: quizConfig.correctOptionId, confusingTopic: "특별히 헷갈리는 건 없고 다 이해했습니다!" },
          { studentId: "10103", studentName: "박지호", understanding: "medium", selectedAnswer: 1, confusingTopic: "이항할 때 부호가 플러스에서 마이너스로 바뀌는 원리가 헷갈려요." },
          { studentId: "10104", studentName: "최예은", understanding: "high", selectedAnswer: quizConfig.correctOptionId, confusingTopic: "없음" },
          { studentId: "10105", studentName: "정도윤", understanding: "medium", selectedAnswer: 3, confusingTopic: "방정식 양변에 같은 수를 더하거나 뺄 때 등호가 왜 유지되는지 궁금해요." },
          { studentId: "10106", studentName: "강하은", understanding: "low", selectedAnswer: 4, confusingTopic: "미지수 x가 포함된 식 자체를 어떻게 풀어야 할지 아예 감이 안 와요ㅠㅠ" },
          { studentId: "10107", studentName: "윤시우", understanding: "high", selectedAnswer: quizConfig.correctOptionId, confusingTopic: "다음 시간에 배울 내용도 기대돼요." },
          { studentId: "10108", studentName: "임수아", understanding: "low", selectedAnswer: 1, confusingTopic: "등식의 성질 4가지 중에 나눗셈 성질 적용하는 게 어려워요." },
          { studentId: "10109", studentName: "한지우", understanding: "medium", selectedAnswer: quizConfig.correctOptionId, confusingTopic: "답은 맞췄는데 계산 과정에서 실수가 잦아요." },
          { studentId: "10110", studentName: "조민재", understanding: "high", selectedAnswer: quizConfig.correctOptionId, confusingTopic: "잘 배웠습니다!" }
        ];

        const formatted = sampleStudents.map((s, idx) => ({
          id: 'sample-' + Date.now() + '-' + idx,
          ...s,
          isCorrect: s.selectedAnswer === quizConfig.correctOptionId,
          submittedAt: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
          timestamp: Date.now() + idx
        }));

        if (dbStatus === 'connected' && firebase.apps.length > 0) {
          try {
            const db = firebase.firestore();
            for (const s of formatted) {
              await db.collection('math_exit_tickets').add(s);
            }
          } catch (e) {
            setResponses((prev) => [...prev, ...formatted]);
          }
        } else {
          setResponses((prev) => [...prev, ...formatted]);
        }
      };

      // 교사: 모든 응답 초기화
      const handleClearAllResponses = async () => {
        if (!window.confirm("모든 학생 응답 데이터를 초기화하시겠습니까?")) return;
        if (dbStatus === 'connected' && firebase.apps.length > 0) {
          try {
            const db = firebase.firestore();
            const snapshot = await db.collection('math_exit_tickets').get();
            const batch = db.batch();
            snapshot.docs.forEach((d) => batch.delete(d.ref));
            await batch.commit();
          } catch (e) {
            console.error("초기화 실패:", e);
          }
        }
        setResponses([]);
      };

      // 통계 계산
      const stats = useMemo(() => {
        const total = responses.length;
        if (total === 0) {
          return {
            total: 0,
            high: 0,
            medium: 0,
            low: 0,
            highPct: 0,
            mediumPct: 0,
            lowPct: 0,
            correctCount: 0,
            wrongCount: 0,
            correctRate: 0,
            wrongStudents: []
          };
        }

        const high = responses.filter((r) => r.understanding === 'high').length;
        const medium = responses.filter((r) => r.understanding === 'medium').length;
        const low = responses.filter((r) => r.understanding === 'low').length;

        const correctResponses = responses.filter((r) => r.selectedAnswer === quizConfig.correctOptionId);
        const wrongResponses = responses.filter((r) => r.selectedAnswer !== quizConfig.correctOptionId);

        const correctCount = correctResponses.length;
        const wrongCount = wrongResponses.length;
        const correctRate = Math.round((correctCount / total) * 100);

        return {
          total,
          high,
          medium,
          low,
          highPct: Math.round((high / total) * 100),
          mediumPct: Math.round((medium / total) * 100),
          lowPct: Math.round((low / total) * 100),
          correctCount,
          wrongCount,
          correctRate,
          wrongStudents: wrongResponses.sort((a, b) => (a.studentId > b.studentId ? 1 : -1))
        };
      }, [responses, quizConfig]);

      // 필터링된 응답 목록
      const filteredResponses = useMemo(() => {
        let list = [...responses];
        if (filterUnderstanding !== 'all') {
          list = list.filter((r) => r.understanding === filterUnderstanding);
        }
        return list.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
      }, [responses, filterUnderstanding]);

      return (
        <div className="min-h-screen bg-slate-50 text-slate-800 flex flex-col font-sans">
          {/* 상단 네비게이션 헤더 */}
          <header className="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-xs">
            <div className="max-w-6xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
              <div className="flex items-center space-x-3">
                <div className="w-10 h-10 rounded-xl bg-indigo-600 text-white flex items-center justify-center shadow-md shadow-indigo-100">
                  <IconGraduation />
                </div>
                <div>
                  <div className="flex items-center space-x-2">
                    <h1 className="font-bold text-base sm:text-lg text-slate-900 leading-tight">수학 수업 3분 마무리 체크</h1>
                    {dbStatus === 'connected' ? (
                      <span className="hidden md:inline-flex items-center px-2 py-0.5 rounded-full text-[10px] font-bold bg-emerald-100 text-emerald-800 border border-emerald-200">
                        <span className="w-1.5 h-1.5 rounded-full bg-emerald-500 mr-1 animate-pulse"></span>
                        Firebase 실시간 연동됨
                      </span>
                    ) : (
                      <span className="hidden md:inline-flex items-center px-2 py-0.5 rounded-full text-[10px] font-medium bg-amber-100 text-amber-800 border border-amber-200">
                        <span className="w-1.5 h-1.5 rounded-full bg-amber-500 mr-1"></span>
                        로컬 실습 모드 (설정 전)
                      </span>
                    )}
                  </div>
                  <p className="text-xs text-indigo-600 font-medium hidden sm:block">실시간 형성평가 & 이해도 피드백 시스템</p>
                </div>
              </div>

              {/* 학생 / 교사 탭 전환 */}
              <div className="flex bg-slate-100 p-1 rounded-xl border border-slate-200">
                <button
                  onClick={() => setActiveTab('student')}
                  className={`flex items-center space-x-1.5 px-3 py-1.5 rounded-lg text-xs sm:text-sm font-semibold transition-all ${
                    activeTab === 'student'
                      ? 'bg-white text-indigo-700 shadow-xs'
                      : 'text-slate-600 hover:text-slate-900'
                  }`}
                >
                  <IconUsers />
                  <span>학생 참여</span>
                </button>
                <button
                  onClick={() => setActiveTab('teacher')}
                  className={`flex items-center space-x-1.5 px-3 py-1.5 rounded-lg text-xs sm:text-sm font-semibold transition-all ${
                    activeTab === 'teacher'
                      ? 'bg-indigo-600 text-white shadow-xs'
                      : 'text-slate-600 hover:text-slate-900'
                  }`}
                >
                  <IconChart />
                  <span>교사 대시보드</span>
                  {responses.length > 0 && (
                    <span className={`ml-1 text-[10px] px-1.5 py-0.2 rounded-full font-bold ${
                      activeTab === 'teacher' ? 'bg-indigo-800 text-indigo-100' : 'bg-indigo-600 text-white'
                    }`}>
                      {responses.length}
                    </span>
                  )}
                </button>
              </div>
            </div>
          </header>

          {/* Firebase 미연결 시 친절한 안내 배너 (코드 복붙 방법 안내) */}
          {dbStatus === 'offline' && (
            <div className="bg-amber-50 border-b border-amber-200 px-4 py-2 text-xs text-amber-900 text-center flex items-center justify-center space-x-2">
              <IconDatabase />
              <span>
                <strong>Firebase 연동 안내:</strong> 코드 상단의 <code className="bg-amber-100 px-1.5 py-0.5 rounded font-mono text-amber-950 font-bold">const firebaseConfig = &#123; ... &#125;</code>에 Firebase 콘솔 설정을 붙여넣으면 여러 기기 간 실시간 공유가 가능합니다. (현재는 단일 브라우저 로컬 실습 모드로 동작 중)
              </span>
            </div>
          )}

          {/* 본문 영역 */}
          <main className="flex-1 max-w-6xl w-full mx-auto p-4 sm:p-6">
            {activeTab === 'student' ? (
              /* ================= [1. 학생 참여 화면] ================= */
              <div className="max-w-2xl mx-auto">
                {submitted ? (
                  /* 제출 완료 카드 */
                  <div className="bg-white rounded-2xl p-6 sm:p-8 border border-emerald-100 shadow-lg text-center mt-4 animate-fadeIn">
                    <div className="w-16 h-16 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto mb-4">
                      <IconCheckCircle />
                    </div>
                    <h2 className="text-2xl font-bold text-slate-900 mb-2">제출 완료! 🎉</h2>
                    <p className="text-slate-600 mb-6 text-sm">
                      <span className="font-semibold text-slate-800">{studentId} {studentName}</span> 학생의 소중한 답변이 선생님께 전달되었습니다. 오늘 수학 수업도 수고 많았습니다!
                    </p>

                    <div className="bg-slate-50 rounded-xl p-4 text-left border border-slate-200 mb-6 space-y-3">
                      <div className="flex items-center justify-between text-sm">
                        <span className="text-slate-500 font-medium">나의 이해도:</span>
                        <span className="font-bold">
                          {understanding === 'high' && '🟢 잘 이해했어요'}
                          {understanding === 'medium' && '🟡 조금 헷갈려요'}
                          {understanding === 'low' && '🔴 잘 모르겠어요'}
                        </span>
                      </div>
                      <div className="flex items-center justify-between text-sm">
                        <span className="text-slate-500 font-medium">선택한 문제 정답:</span>
                        <span className={`font-semibold ${selectedAnswer === quizConfig.correctOptionId ? 'text-emerald-600' : 'text-amber-600'}`}>
                          {quizConfig.options.find(o => o.id === selectedAnswer)?.text} 
                          {selectedAnswer === quizConfig.correctOptionId ? ' (정답! ✨)' : ' (선생님 피드백을 확인해보세요)'}
                        </span>
                      </div>
                      {confusingTopic && (
                        <div className="text-sm pt-2 border-t border-slate-200">
                          <span className="text-slate-500 font-medium block mb-1">작성한 질문/헷갈리는 점:</span>
                          <p className="text-slate-700 bg-white p-2.5 rounded-lg border border-slate-200 text-xs">
                            "{confusingTopic}"
                          </p>
                        </div>
                      )}
                    </div>

                    <div className="flex flex-col sm:flex-row gap-3 justify-center">
                      <button
                        onClick={handleResetForm}
                        className="px-5 py-2.5 rounded-xl border border-slate-300 text-slate-700 hover:bg-slate-100 font-medium text-sm transition-colors"
                      >
                        수정 후 다시 제출하기
                      </button>
                      <button
                        onClick={() => setActiveTab('teacher')}
                        className="px-5 py-2.5 rounded-xl bg-indigo-600 text-white hover:bg-indigo-700 font-medium text-sm transition-colors"
                      >
                        교사 화면에서 실시간 집계 확인
                      </button>
                    </div>
                  </div>
                ) : (
                  /* 학생 질문 작성 폼 */
                  <form onSubmit={handleSubmitResponse} className="space-y-5">
                    {/* 상단 안내 배너 */}
                    <div className="bg-gradient-to-r from-indigo-600 to-indigo-800 rounded-2xl p-5 text-white shadow-md">
                      <div className="flex items-center space-x-1.5 text-indigo-200 text-xs font-semibold uppercase tracking-wider mb-1">
                        <IconClock />
                        <span>수업 종료 3분 전 체크타임</span>
                      </div>
                      <h2 className="text-xl font-bold">오늘의 수학 수업 배움 확인</h2>
                      <p className="text-indigo-100 text-xs mt-1">
                        오늘 배운 핵심 내용을 되돌아보고 솔직하게 작성해주세요.
                      </p>
                    </div>

                    {/* 1. 기본 정보 (학번 & 이름) */}
                    <div className="bg-white rounded-2xl p-5 border border-slate-200 shadow-xs">
                      <h3 className="font-semibold text-slate-900 text-sm mb-3 flex items-center space-x-2">
                        <span className="w-5 h-5 rounded-full bg-slate-100 text-slate-700 flex items-center justify-center text-xs font-bold">1</span>
                        <span>학생 기본 정보</span>
                      </h3>
                      <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                        <div>
                          <label className="block text-xs font-medium text-slate-600 mb-1">
                            학번 (예: 10101, 1-1-1) <span className="text-rose-500">*</span>
                          </label>
                          <input
                            type="text"
                            value={studentId}
                            onChange={(e) => setStudentId(e.target.value)}
                            placeholder="예: 10105"
                            required
                            className="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm font-medium"
                          />
                        </div>
                        <div>
                          <label className="block text-xs font-medium text-slate-600 mb-1">
                            이름 <span className="text-rose-500">*</span>
                          </label>
                          <input
                            type="text"
                            value={studentName}
                            onChange={(e) => setStudentName(e.target.value)}
                            placeholder="예: 홍길동"
                            required
                            className="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm font-medium"
                          />
                        </div>
                      </div>
                    </div>

                    {/* 2. 이해도 선택 (3지선다) */}
                    <div className="bg-white rounded-2xl p-5 border border-slate-200 shadow-xs">
                      <h3 className="font-semibold text-slate-900 text-sm mb-3 flex items-center space-x-2">
                        <span className="w-5 h-5 rounded-full bg-indigo-100 text-indigo-700 flex items-center justify-center text-xs font-bold">2</span>
                        <span>오늘 배운 내용의 이해도를 선택해주세요. <span className="text-rose-500">*</span></span>
                      </h3>

                      <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                        <button
                          type="button"
                          onClick={() => setUnderstanding('high')}
                          className={`p-4 rounded-xl border-2 text-center transition-all flex flex-col items-center justify-center space-y-1.5 ${
                            understanding === 'high'
                              ? 'border-emerald-500 bg-emerald-50/90 text-emerald-900 shadow-xs ring-2 ring-emerald-400/30'
                              : 'border-slate-200 bg-slate-50/50 hover:bg-slate-100 text-slate-700'
                          }`}
                        >
                          <span className="text-2xl">😊</span>
                          <span className="font-bold text-sm">잘 이해했어요</span>
                          <span className="text-[11px] text-slate-500">혼자서 풀 수 있어요</span>
                        </button>

                        <button
                          type="button"
                          onClick={() => setUnderstanding('medium')}
                          className={`p-4 rounded-xl border-2 text-center transition-all flex flex-col items-center justify-center space-y-1.5 ${
                            understanding === 'medium'
                              ? 'border-amber-500 bg-amber-50/90 text-amber-900 shadow-xs ring-2 ring-amber-400/30'
                              : 'border-slate-200 bg-slate-50/50 hover:bg-slate-100 text-slate-700'
                          }`}
                        >
                          <span className="text-2xl">🤔</span>
                          <span className="font-bold text-sm">조금 헷갈려요</span>
                          <span className="text-[11px] text-slate-500">도움이 약간 필요해요</span>
                        </button>

                        <button
                          type="button"
                          onClick={() => setUnderstanding('low')}
                          className={`p-4 rounded-xl border-2 text-center transition-all flex flex-col items-center justify-center space-y-1.5 ${
                            understanding === 'low'
                              ? 'border-rose-500 bg-rose-50/90 text-rose-900 shadow-xs ring-2 ring-rose-400/30'
                              : 'border-slate-200 bg-slate-50/50 hover:bg-slate-100 text-slate-700'
                          }`}
                        >
                          <span className="text-2xl">😢</span>
                          <span className="font-bold text-sm">잘 모르겠어요</span>
                          <span className="text-[11px] text-slate-500">다시 설명이 필요해요</span>
                        </button>
                      </div>
                    </div>

                    {/* 3. 오늘의 수학 확인 문제 */}
                    <div className="bg-white rounded-2xl p-5 border border-slate-200 shadow-xs">
                      <div className="flex items-center justify-between mb-3">
                        <h3 className="font-semibold text-slate-900 text-sm flex items-center space-x-2">
                          <span className="w-5 h-5 rounded-full bg-indigo-100 text-indigo-700 flex items-center justify-center text-xs font-bold">3</span>
                          <span>오늘의 확인 문제 (1문제) <span className="text-rose-500">*</span></span>
                        </h3>
                        <span className="text-xs bg-indigo-50 text-indigo-700 px-2 py-0.5 rounded font-medium">개념 체크</span>
                      </div>

                      <div className="p-4 bg-slate-50 rounded-xl border border-slate-200 mb-4">
                        <p className="text-sm font-semibold text-slate-900 whitespace-pre-wrap">
                          Q. {quizConfig.question}
                        </p>
                      </div>

                      <div className="space-y-2.5">
                        {quizConfig.options.map((opt) => (
                          <button
                            key={opt.id}
                            type="button"
                            onClick={() => setSelectedAnswer(opt.id)}
                            className={`w-full p-3.5 rounded-xl border text-left text-sm font-medium transition-all flex items-center justify-between ${
                              selectedAnswer === opt.id
                                ? 'border-indigo-600 bg-indigo-50/80 text-indigo-950 font-bold ring-2 ring-indigo-400/30'
                                : 'border-slate-200 hover:bg-slate-50 text-slate-700'
                            }`}
                          >
                            <div className="flex items-center space-x-3">
                              <span className={`w-6 h-6 rounded-full text-xs flex items-center justify-center font-bold ${
                                selectedAnswer === opt.id ? 'bg-indigo-600 text-white' : 'bg-slate-200 text-slate-600'
                              }`}>
                                {opt.id}
                              </span>
                              <span>{opt.text}</span>
                            </div>
                            {selectedAnswer === opt.id && (
                              <IconCheck className="w-4 h-4 text-indigo-600" />
                            )}
                          </button>
                        ))}
                      </div>
                    </div>

                    {/* 4. 가장 헷갈리는 내용 서술 */}
                    <div className="bg-white rounded-2xl p-5 border border-slate-200 shadow-xs">
                      <h3 className="font-semibold text-slate-900 text-sm mb-1 flex items-center space-x-2">
                        <span className="w-5 h-5 rounded-full bg-indigo-100 text-indigo-700 flex items-center justify-center text-xs font-bold">4</span>
                        <span>가장 헷갈리거나 질문하고 싶은 내용을 적어주세요.</span>
                      </h3>
                      <p className="text-xs text-slate-500 mb-3 ml-7">
                        어떤 풀이 과정이나 개념이 어려웠나요? 짧게 적어도 괜찮습니다. (없으면 '없음' 입력)
                      </p>
                      <textarea
                        rows={3}
                        value={confusingTopic}
                        onChange={(e) => setConfusingTopic(e.target.value)}
                        placeholder="예: 등식의 양변을 나눌 때 부호 실수가 잦아요 / 이항할 때 부호 바뀌는 원리가 헷갈려요"
                        className="w-full p-3.5 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm"
                      />
                    </div>

                    {/* 상태 메시지 */}
                    {statusMessage.text && (
                      <div className={`p-3.5 rounded-xl text-xs sm:text-sm font-medium ${
                        statusMessage.type === 'error' ? 'bg-rose-50 text-rose-700 border border-rose-200' : 'bg-emerald-50 text-emerald-700 border border-emerald-200'
                      }`}>
                        {statusMessage.text}
                      </div>
                    )}

                    {/* 제출 버튼 */}
                    <button
                      type="submit"
                      disabled={isSubmitting}
                      className="w-full py-3.5 px-6 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-base shadow-lg shadow-indigo-100 transition-all flex items-center justify-center space-x-2 disabled:opacity-50"
                    >
                      {isSubmitting ? (
                        <span>제출 중입니다...</span>
                      ) : (
                        <>
                          <span>선생님께 제출하기</span>
                          <IconSend />
                        </>
                      )}
                    </button>
                  </form>
                )}
              </div>
            ) : (
              /* ================= [2. 교사 대시보드 화면] ================= */
              <div className="space-y-6 animate-fadeIn">
                {/* 상단 실시간 컨트롤 바 */}
                <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 bg-white p-5 rounded-2xl border border-slate-200 shadow-xs">
                  <div>
                    <div className="flex items-center space-x-2">
                      <h2 className="text-xl font-bold text-slate-900">실시간 수업 마무리 피드백</h2>
                      <span className="flex items-center space-x-1.5 px-2.5 py-0.5 rounded-full text-xs font-semibold bg-emerald-100 text-emerald-700">
                        <span className="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                        <span>{dbStatus === 'connected' ? '실시간 DB 연동 중' : '로컬 실습 모드'}</span>
                      </span>
                    </div>
                    <p className="text-xs text-slate-500 mt-1">
                      현재 총 <span className="font-bold text-indigo-600">{stats.total}명</span>의 학생이 응답을 완료했습니다.
                    </p>
                  </div>

                  {/* 실습 도구 버튼들 */}
                  <div className="flex flex-wrap items-center gap-2">
                    <button
                      onClick={() => setIsEditingQuiz(true)}
                      className="px-3 py-2 rounded-xl border border-slate-200 hover:bg-slate-50 text-xs font-semibold text-slate-700 flex items-center space-x-1.5 transition-colors"
                    >
                      <IconEdit />
                      <span>확인 문제 수정</span>
                    </button>
                    <button
                      onClick={handleGenerateSampleData}
                      className="px-3 py-2 rounded-xl bg-indigo-50 hover:bg-indigo-100 text-indigo-700 text-xs font-semibold flex items-center space-x-1.5 transition-colors"
                      title="연수 실습용 10명의 가상 학생 응답을 즉시 채워 넣습니다."
                    >
                      <IconSparkles />
                      <span>실습용 10명 데이터 추가</span>
                    </button>
                    <button
                      onClick={handleClearAllResponses}
                      className="px-3 py-2 rounded-xl border border-rose-200 hover:bg-rose-50 text-rose-600 text-xs font-semibold flex items-center space-x-1.5 transition-colors"
                      title="모든 응답 데이터를 비웁니다."
                    >
                      <IconRefresh />
                      <span>초기화</span>
                    </button>
                  </div>
                </div>

                {/* 핵심 통계 요약 (이해도 현황 & 정답률/오답 분석) */}
                <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                  {/* 1. 이해도 현황 통계 카드 */}
                  <div className="bg-white rounded-2xl p-6 border border-slate-200 shadow-xs flex flex-col justify-between">
                    <div>
                      <div className="flex items-center justify-between mb-4">
                        <h3 className="font-bold text-slate-900 text-base flex items-center space-x-2">
                          <span className="w-2.5 h-2.5 rounded-full bg-indigo-600"></span>
                          <span>학습 내용 이해도 현황</span>
                        </h3>
                        <span className="text-xs text-slate-400 font-medium">3점 척도</span>
                      </div>

                      {/* 3지선다 인원수 카드 */}
                      <div className="grid grid-cols-3 gap-3 mb-6">
                        <div className="bg-emerald-50/70 border border-emerald-200 rounded-xl p-3.5 text-center">
                          <div className="text-2xl mb-1">😊</div>
                          <div className="text-xs font-semibold text-emerald-800">잘 이해했어요</div>
                          <div className="text-2xl font-extrabold text-emerald-600 mt-1">
                            {stats.high}<span className="text-xs font-normal text-emerald-800 ml-0.5">명</span>
                          </div>
                          <div className="text-[11px] text-emerald-700/80 font-medium">{stats.highPct}%</div>
                        </div>

                        <div className="bg-amber-50/70 border border-amber-200 rounded-xl p-3.5 text-center">
                          <div className="text-2xl mb-1">🤔</div>
                          <div className="text-xs font-semibold text-amber-800">조금 헷갈려요</div>
                          <div className="text-2xl font-extrabold text-amber-600 mt-1">
                            {stats.medium}<span className="text-xs font-normal text-amber-800 ml-0.5">명</span>
                          </div>
                          <div className="text-[11px] text-amber-700/80 font-medium">{stats.mediumPct}%</div>
                        </div>

                        <div className="bg-rose-50/70 border border-rose-200 rounded-xl p-3.5 text-center">
                          <div className="text-2xl mb-1">😢</div>
                          <div className="text-xs font-semibold text-rose-800">잘 모르겠어요</div>
                          <div className="text-2xl font-extrabold text-rose-600 mt-1">
                            {stats.low}<span className="text-xs font-normal text-rose-800 ml-0.5">명</span>
                          </div>
                          <div className="text-[11px] text-rose-700/80 font-medium">{stats.lowPct}%</div>
                        </div>
                      </div>

                      {/* 시각화 프로그레스 바 */}
                      <div className="space-y-1.5">
                        <div className="flex justify-between text-xs font-medium text-slate-500">
                          <span>비율 막대</span>
                          <span>전체 {stats.total}명</span>
                        </div>
                        <div className="h-4 rounded-full bg-slate-100 flex overflow-hidden p-0.5 border border-slate-200">
                          {stats.highPct > 0 && (
                            <div
                              style={{ width: `${stats.highPct}%` }}
                              className="bg-emerald-500 rounded-l-full h-full transition-all duration-500"
                              title={`잘 이해했어요: ${stats.high}명 (${stats.highPct}%)`}
                            />
                          )}
                          {stats.mediumPct > 0 && (
                            <div
                              style={{ width: `${stats.mediumPct}%` }}
                              className="bg-amber-400 h-full transition-all duration-500"
                              title={`조금 헷갈려요: ${stats.medium}명 (${stats.mediumPct}%)`}
                            />
                          )}
                          {stats.lowPct > 0 && (
                            <div
                              style={{ width: `${stats.lowPct}%` }}
                              className="bg-rose-500 rounded-r-full h-full transition-all duration-500"
                              title={`잘 모르겠어요: ${stats.low}명 (${stats.lowPct}%)`}
                            />
                          )}
                        </div>
                      </div>
                    </div>

                    {/* 교사용 피드백 가이드 */}
                    <div className="mt-5 p-3 rounded-xl bg-slate-50 border border-slate-200 text-xs text-slate-600 flex items-center space-x-2">
                      <IconTrending />
                      <span>
                        {stats.low + stats.medium > stats.high
                          ? '⚠️ 보충 설명이 필요한 학생이 많습니다. 다음 시간 도입부에 핵심 풀이 2분 복습을 권장합니다.'
                          : '✨ 전반적으로 수업 목표 도달도가 우수합니다. 심화 연습으로 원활히 진행할 수 있습니다.'}
                      </span>
                    </div>
                  </div>

                  {/* 2. 확인 문제 정답률 및 오답 학생 학번 리스트 */}
                  <div className="bg-white rounded-2xl p-6 border border-slate-200 shadow-xs flex flex-col justify-between">
                    <div>
                      <div className="flex items-center justify-between mb-4">
                        <h3 className="font-bold text-slate-900 text-base flex items-center space-x-2">
                          <span className="w-2.5 h-2.5 rounded-full bg-indigo-600"></span>
                          <span>확인 문제 정답률 & 오답 분석</span>
                        </h3>
                        <span className="text-xs bg-indigo-50 text-indigo-700 px-2 py-0.5 rounded-md font-bold">
                          정답: {quizConfig.correctOptionId}번
                        </span>
                      </div>

                      {/* 정답률 수치 카드 */}
                      <div className="grid grid-cols-2 gap-3 mb-5">
                        <div className="p-4 rounded-xl bg-indigo-50/60 border border-indigo-100 flex items-center justify-between">
                          <div>
                            <div className="text-xs font-semibold text-indigo-700">확인 문제 정답률</div>
                            <div className="text-3xl font-extrabold text-indigo-600 mt-1">
                              {stats.correctRate}<span className="text-lg font-bold">%</span>
                            </div>
                          </div>
                          <div className="text-xs text-indigo-800 font-medium bg-white px-2 py-1 rounded-lg shadow-xs border border-indigo-100">
                            {stats.correctCount} / {stats.total}명
                          </div>
                        </div>

                        <div className="p-4 rounded-xl bg-rose-50/60 border border-rose-100 flex items-center justify-between">
                          <div>
                            <div className="text-xs font-semibold text-rose-700">오답자 수</div>
                            <div className="text-3xl font-extrabold text-rose-600 mt-1">
                              {stats.wrongCount}<span className="text-lg font-bold">명</span>
                            </div>
                          </div>
                          <div className="text-xs text-rose-800 font-medium bg-white px-2 py-1 rounded-lg shadow-xs border border-rose-100">
                            오답률 {stats.total > 0 ? 100 - stats.correctRate : 0}%
                          </div>
                        </div>
                      </div>

                      {/* 오답 학생 학번 목록 */}
                      <div>
                        <div className="flex items-center justify-between mb-2">
                          <h4 className="text-xs font-bold text-slate-700 flex items-center space-x-1.5">
                            <IconUserX />
                            <span>오답 학생 학번 및 선택 보기</span>
                          </h4>
                          <span className="text-[11px] text-slate-400">총 {stats.wrongStudents.length}명</span>
                        </div>

                        {stats.wrongStudents.length > 0 ? (
                          <div className="max-h-36 overflow-y-auto p-2.5 bg-rose-50/30 rounded-xl border border-rose-200 flex flex-wrap gap-2">
                            {stats.wrongStudents.map((st) => (
                              <div
                                key={st.id || st.studentId}
                                className="bg-white border border-rose-300 px-2.5 py-1 rounded-lg text-xs flex items-center space-x-1.5 shadow-xs"
                              >
                                <span className="font-bold text-rose-700 font-mono">{st.studentId}</span>
                                <span className="text-slate-600 font-medium">({st.studentName})</span>
                                <span className="bg-rose-100 text-rose-800 font-bold px-1.5 py-0.5 rounded text-[10px]">
                                  {st.selectedAnswer}번 선택
                                </span>
                              </div>
                            ))}
                          </div>
                        ) : (
                          <div className="p-4 bg-emerald-50/50 rounded-xl border border-emerald-200 text-center text-xs text-emerald-800 font-medium">
                            {stats.total === 0 ? "아직 제출된 응답이 없습니다." : "🎉 모든 학생이 정답을 맞혔습니다!"}
                          </div>
                        )}
                      </div>
                    </div>

                    <div className="mt-4 pt-3 border-t border-slate-100 text-xs text-slate-500 truncate">
                      <span className="font-semibold text-slate-700">문제:</span> {quizConfig.question}
                    </div>
                  </div>
                </div>

                {/* 3. 학생들이 남긴 헷갈리는 내용/질문 보드 */}
                <div className="bg-white rounded-2xl p-6 border border-slate-200 shadow-xs">
                  <div className="flex items-center justify-between mb-4">
                    <div className="flex items-center space-x-2">
                      <IconMessage />
                      <h3 className="font-bold text-slate-900 text-base">학생들이 남긴 헷갈리는 내용 & 질문</h3>
                    </div>
                    <span className="text-xs bg-slate-100 text-slate-600 px-2.5 py-1 rounded-full font-medium">
                      수업 종료 1분 즉시 피드백용
                    </span>
                  </div>

                  {responses.filter(r => r.confusingTopic && r.confusingTopic.trim() !== '없음' && r.confusingTopic.trim() !== '').length > 0 ? (
                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3">
                      {responses
                        .filter(r => r.confusingTopic && r.confusingTopic.trim() !== '없음' && r.confusingTopic.trim() !== '')
                        .map((item, idx) => (
                          <div 
                            key={item.id || idx} 
                            className={`p-4 rounded-xl border text-xs flex flex-col justify-between space-y-2 transition-all hover:shadow-xs ${
                              item.understanding === 'low' 
                                ? 'bg-rose-50/60 border-rose-200' 
                                : item.understanding === 'medium'
                                ? 'bg-amber-50/60 border-amber-200'
                                : 'bg-slate-50 border-slate-200'
                            }`}
                          >
                            <p className="text-slate-800 font-medium leading-relaxed">
                              "{item.confusingTopic}"
                            </p>
                            <div className="flex items-center justify-between pt-2 border-t border-black/5 text-[11px] text-slate-500">
                              <span className="font-semibold font-mono">{item.studentId} ({item.studentName})</span>
                              <span>
                                {item.understanding === 'high' && '🟢 이해함'}
                                {item.understanding === 'medium' && '🟡 헷갈림'}
                                {item.understanding === 'low' && '🔴 모름'}
                              </span>
                            </div>
                          </div>
                        ))}
                    </div>
                  ) : (
                    <div className="p-8 text-center text-slate-400 text-xs bg-slate-50 rounded-xl border border-dashed border-slate-200">
                      아직 등록된 학생 질문이나 헷갈리는 내용이 없습니다.
                    </div>
                  )}
                </div>

                {/* 4. 전체 응답 기록 테이블 */}
                <div className="bg-white rounded-2xl p-6 border border-slate-200 shadow-xs">
                  <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-4">
                    <h3 className="font-bold text-slate-900 text-base">전체 학생 응답 상세 기록</h3>
                    
                    {/* 이해도 필터 */}
                    <div className="flex items-center space-x-1.5 text-xs">
                      <span className="text-slate-500 font-medium mr-1">필터:</span>
                      {[
                        { key: 'all', label: '전체' },
                        { key: 'high', label: '🟢 이해' },
                        { key: 'medium', label: '🟡 헷갈림' },
                        { key: 'low', label: '🔴 모름' }
                      ].map((btn) => (
                        <button
                          key={btn.key}
                          onClick={() => setFilterUnderstanding(btn.key)}
                          className={`px-2.5 py-1 rounded-lg font-medium transition-colors ${
                            filterUnderstanding === btn.key
                              ? 'bg-indigo-600 text-white'
                              : 'bg-slate-100 text-slate-600 hover:bg-slate-200'
                          }`}
                        >
                          {btn.label}
                        </button>
                      ))}
                    </div>
                  </div>

                  {filteredResponses.length > 0 ? (
                    <div className="overflow-x-auto">
                      <table className="w-full text-left text-xs border-collapse">
                        <thead>
                          <tr className="bg-slate-50 border-b border-slate-200 text-slate-500 uppercase tracking-wider font-semibold">
                            <th className="p-3">학번</th>
                            <th className="p-3">이름</th>
                            <th className="p-3 text-center">이해도</th>
                            <th className="p-3 text-center">선택 답안</th>
                            <th className="p-3 text-center">정답 여부</th>
                            <th className="p-3">가장 헷갈리는 내용</th>
                          </tr>
                        </thead>
                        <tbody className="divide-y divide-slate-100">
                          {filteredResponses.map((res) => {
                            const isCorrect = res.selectedAnswer === quizConfig.correctOptionId;
                            return (
                              <tr key={res.id || res.studentId} className="hover:bg-slate-50/70 transition-colors">
                                <td className="p-3 font-mono font-bold text-slate-700">{res.studentId}</td>
                                <td className="p-3 font-semibold text-slate-800">{res.studentName}</td>
                                <td className="p-3 text-center">
                                  {res.understanding === 'high' && (
                                    <span className="inline-flex items-center px-2 py-0.5 rounded-full text-[11px] font-bold bg-emerald-100 text-emerald-800">
                                      잘 이해했어요
                                    </span>
                                  )}
                                  {res.understanding === 'medium' && (
                                    <span className="inline-flex items-center px-2 py-0.5 rounded-full text-[11px] font-bold bg-amber-100 text-amber-800">
                                      조금 헷갈려요
                                    </span>
                                  )}
                                  {res.understanding === 'low' && (
                                    <span className="inline-flex items-center px-2 py-0.5 rounded-full text-[11px] font-bold bg-rose-100 text-rose-800">
                                      잘 모르겠어요
                                    </span>
                                  )}
                                </td>
                                <td className="p-3 text-center font-mono font-semibold">
                                  {res.selectedAnswer}번
                                </td>
                                <td className="p-3 text-center">
                                  {isCorrect ? (
                                    <span className="inline-flex items-center space-x-1 text-emerald-600 font-bold">
                                      <IconCheck className="w-3.5 h-3.5" />
                                      <span>정답</span>
                                    </span>
                                  ) : (
                                    <span className="inline-flex items-center space-x-1 text-rose-600 font-bold">
                                      <IconX className="w-3.5 h-3.5" />
                                      <span>오답</span>
                                    </span>
                                  )}
                                </td>
                                <td className="p-3 text-slate-600 max-w-xs truncate">
                                  {res.confusingTopic || <span className="text-slate-300">-</span>}
                                </td>
                              </tr>
                            );
                          })}
                        </tbody>
                      </table>
                    </div>
                  ) : (
                    <div className="p-8 text-center text-slate-400 text-xs bg-slate-50 rounded-xl">
                      조건에 맞는 학생 응답이 없습니다.
                    </div>
                  )}
                </div>
              </div>
            )}
          </main>

          {/* 확인 문제 편집 모달 (교사용) */}
          {isEditingQuiz && (
            <div className="fixed inset-0 bg-black/40 backdrop-blur-xs flex items-center justify-center p-4 z-50 animate-fadeIn">
              <div className="bg-white rounded-2xl max-w-xl w-full p-6 shadow-2xl border border-slate-100 max-h-[90vh] overflow-y-auto">
                <div className="flex items-center justify-between mb-4">
                  <h3 className="text-lg font-bold text-slate-900 flex items-center space-x-2">
                    <IconEdit />
                    <span>오늘의 확인 문제 편집</span>
                  </h3>
                  <button
                    onClick={() => setIsEditingQuiz(false)}
                    className="text-slate-400 hover:text-slate-600 text-xl font-bold p-1"
                  >
                    ✕
                  </button>
                </div>

                <form onSubmit={handleSaveQuiz} className="space-y-4">
                  <div>
                    <label className="block text-xs font-bold text-slate-700 mb-1">문제 내용</label>
                    <textarea
                      rows={2}
                      value={editForm.question}
                      onChange={(e) => setEditForm({ ...editForm, question: e.target.value })}
                      required
                      className="w-full p-3 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm font-medium"
                    />
                  </div>

                  <div>
                    <label className="block text-xs font-bold text-slate-700 mb-2">보기 및 정답 설정 (라디오 버튼으로 정답 지정)</label>
                    <div className="space-y-2">
                      {editForm.options.map((opt, index) => (
                        <div key={opt.id} className="flex items-center space-x-2">
                          <input
                            type="radio"
                            name="correctOpt"
                            checked={editForm.correctOptionId === opt.id}
                            onChange={() => setEditForm({ ...editForm, correctOptionId: opt.id })}
                            className="w-4 h-4 text-indigo-600 focus:ring-indigo-500"
                            title="정답으로 선택"
                          />
                          <span className="text-xs font-bold text-slate-500 w-5">{opt.id}번</span>
                          <input
                            type="text"
                            value={opt.text}
                            onChange={(e) => {
                              const newOpts = [...editForm.options];
                              newOpts[index].text = e.target.value;
                              setEditForm({ ...editForm, options: newOpts });
                            }}
                            required
                            className="flex-1 px-3 py-2 rounded-xl border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
                          />
                        </div>
                      ))}
                    </div>
                  </div>

                  <div>
                    <label className="block text-xs font-bold text-slate-700 mb-1">정답 해설 (선택)</label>
                    <input
                      type="text"
                      value={editForm.explanation || ''}
                      onChange={(e) => setEditForm({ ...editForm, explanation: e.target.value })}
                      placeholder="예: 양변에서 6을 빼고 2로 나눕니다."
                      className="w-full px-3 py-2 rounded-xl border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
                    />
                  </div>

                  <div className="flex justify-end space-x-2 pt-4 border-t border-slate-100">
                    <button
                      type="button"
                      onClick={() => setIsEditingQuiz(false)}
                      className="px-4 py-2 rounded-xl border border-slate-300 text-slate-700 text-xs font-semibold hover:bg-slate-50"
                    >
                      취소
                    </button>
                    <button
                      type="submit"
                      className="px-5 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold shadow-md shadow-indigo-100"
                    >
                      문제 저장 및 배포
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* 하단 푸터 */}
          <footer className="bg-white border-t border-slate-200 py-3 text-center text-xs text-slate-400">
            수학 교원 연수 및 실습용 Exit Ticket 시스템 • 수업 종료 3분 전 형성평가 & 피드백
          </footer>
        </div>
      );
    }

    // React 18 렌더링
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
