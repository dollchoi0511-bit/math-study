<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>수업용 스마트 타이머</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Noto Sans KR, Black Han Sans for visual punch -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;600;800;900&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Noto Sans KR', 'sans-serif'],
                        title: ['Black Han Sans', 'sans-serif'],
                        digits: ['Orbitron', 'monospace'],
                    },
                    keyframes: {
                        pulseGlow: {
                            '0%, 100%': { boxShadow: '0 0 25px rgba(239, 68, 68, 0.4), inset 0 0 15px rgba(239, 68, 68, 0.2)' },
                            '50%': { boxShadow: '0 0 60px rgba(239, 68, 68, 0.8), inset 0 0 35px rgba(239, 68, 68, 0.5)' }
                        },
                        urgentBeat: {
                            '0%, 100%': { transform: 'scale(1)' },
                            '50%': { transform: 'scale(1.03)' }
                        },
                        bellRinging: {
                            '0%, 100%': { transform: 'rotate(0deg)' },
                            '15%': { transform: 'rotate(25deg)' },
                            '30%': { transform: 'rotate(-25deg)' },
                            '45%': { transform: 'rotate(18deg)' },
                            '60%': { transform: 'rotate(-18deg)' },
                            '75%': { transform: 'rotate(10deg)' },
                        },
                        warningBg: {
                            '0%, 100%': { backgroundColor: '#18181b' },
                            '50%': { backgroundColor: '#311111' }
                        },
                        strobeLight: {
                            '0%, 100%': { opacity: '0.2' },
                            '50%': { opacity: '0.7' }
                        }
                    },
                    animation: {
                        'pulse-glow': 'pulseGlow 1.2s infinite ease-in-out',
                        'urgent-beat': 'urgentBeat 0.8s infinite ease-in-out',
                        'bell-ring': 'bellRinging 0.8s infinite ease-in-out',
                        'warning-bg': 'warningBg 1.5s infinite ease-in-out',
                        'strobe': 'strobeLight 1s infinite ease-in-out',
                    }
                }
            }
        }
    </script>
    
    <style>
        /* Custom styled scrollbars & SVG circular animation transitions */
        circle.progress-ring {
            transition: stroke-dashoffset 0.3s linear, stroke 0.5s ease;
            transform: rotate(-90deg);
            transform-origin: 50% 50%;
        }
        
        .glass-panel {
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }

        .glass-panel-dark {
            background: rgba(18, 18, 24, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        /* Chalkboard Theme Style Option */
        .chalkboard-bg {
            background-color: #1a2f23;
            background-image: radial-gradient(#254231 15%, transparent 16%), radial-gradient(#1f382a 15%, transparent 16%);
            background-size: 60px 60px;
            background-position: 0 0, 30px 30px;
        }

        /* Floating dynamic particles under 1 min */
        .alert-particle {
            position: absolute;
            pointer-events: none;
            animation: floatUp 3s infinite linear;
            border-radius: 50%;
        }

        @keyframes floatUp {
            0% { transform: translateY(0) scale(1); opacity: 0.8; }
            100% { transform: translateY(-100vh) scale(1.5); opacity: 0; }
        }
    </style>
</head>
<body id="mainBody" class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between select-none overflow-x-hidden transition-colors duration-700 font-sans">

    <!-- Top Bar Navigation / Activity Title -->
    <header class="w-full px-6 py-4 flex flex-wrap justify-between items-center gap-4 z-20 glass-panel border-b border-slate-800">
        <div class="flex items-center gap-3">
            <div class="bg-indigo-600 text-white p-2.5 rounded-xl shadow-lg shadow-indigo-600/30 flex items-center justify-center">
                <i class="fa-solid font-bold fa-stopwatch text-2xl"></i>
            </div>
            <div>
                <h1 class="text-xl md:text-2xl font-black font-title tracking-wide text-transparent bg-clip-text bg-gradient-to-r from-indigo-400 via-purple-300 to-pink-400">
                    스마트 수업 타이머
                </h1>
                <p class="text-xs text-slate-400 font-medium hidden sm:block">직관적이고 생동감 있는 교실용 인터랙티브 시계</p>
            </div>
        </div>

        <!-- Activity Title Input (Shows big on projector) -->
        <div class="flex-1 max-w-md mx-2">
            <div class="relative flex items-center">
                <i class="fa-solid fa-chalkboard-user absolute left-3.5 text-indigo-400 text-sm"></i>
                <input type="text" id="activityTitle" value="🔔 모둠 활동 및 과제 진행 시간" 
                    placeholder="수업 활동 제목을 입력하세요 (예: 5분 모둠 토의)"
                    class="w-full pl-10 pr-4 py-2 bg-slate-900/80 border border-slate-700/80 rounded-xl text-slate-100 placeholder-slate-500 text-sm font-semibold focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/30 transition-all text-center sm:text-left">
            </div>
        </div>

        <!-- Actions / Settings buttons -->
        <div class="flex items-center gap-2">
            <!-- Theme Toggle -->
            <button id="themeBtn" title="배경 테마 변경" class="p-2.5 bg-slate-800/80 hover:bg-slate-700 border border-slate-700 rounded-xl text-slate-300 transition-all">
                <i class="fa-solid fa-palette"></i>
            </button>
            <!-- Sound Toggle -->
            <button id="soundToggleBtn" title="소리 켜기/끄기" class="p-2.5 bg-slate-800/80 hover:bg-slate-700 border border-slate-700 rounded-xl text-emerald-400 transition-all flex items-center gap-1.5 px-3">
                <i id="soundIcon" class="fa-solid fa-volume-high"></i>
                <span id="soundLabel" class="text-xs font-bold hidden md:inline">소리 켜짐</span>
            </button>
            <!-- Fullscreen Button -->
            <button id="fullscreenBtn" title="전체화면" class="p-2.5 bg-slate-800/80 hover:bg-slate-700 border border-slate-700 rounded-xl text-slate-300 transition-all">
                <i id="fullscreenIcon" class="fa-solid fa-expand"></i>
            </button>
        </div>
    </header>

    <!-- Main Interactive Display Section -->
    <main class="flex-1 flex flex-col items-center justify-center px-4 py-6 relative z-10 w-full max-w-6xl mx-auto">
        
        <!-- Under 1 Minute Alert Warning Banner (Hidden by default) -->
        <div id="urgentBanner" class="hidden mb-4 px-6 py-2 bg-gradient-to-r from-red-600 via-amber-500 to-red-600 text-white rounded-full font-black text-sm md:text-lg tracking-wider shadow-lg shadow-red-600/50 animate-urgent-beat flex items-center gap-2 border border-red-300/40">
            <i class="fa-solid fa-triangle-exclamation text-amber-200"></i>
            <span>⚠️ 남은 시간 1분 미만! 마지막 점검을 진행하세요!</span>
            <i class="fa-solid fa-bolt text-amber-200"></i>
        </div>

        <!-- Central Timer Card -->
        <div id="timerCard" class="relative w-full max-w-xl aspect-square max-h-[520px] rounded-3xl glass-panel-dark p-6 flex flex-col items-center justify-center shadow-2xl transition-all duration-500 border border-slate-800">
            
            <!-- SVG Circular Visual Progress Ring -->
            <div class="relative w-full h-full flex items-center justify-center">
                <svg class="w-full h-full max-w-[420px] max-h-[420px]" viewBox="0 0 360 360">
                    <!-- Background Circle -->
                    <circle 
                        cx="180" cy="180" r="150" 
                        fill="none" 
                        stroke="#1e293b" 
                        stroke-width="18" 
                    />
                    <!-- Dynamic Progress Circle -->
                    <circle 
                        id="progressRing"
                        class="progress-ring"
                        cx="180" cy="180" r="150" 
                        fill="none" 
                        stroke="url(#ringGradient)" 
                        stroke-width="18" 
                        stroke-linecap="round"
                        stroke-dasharray="942.47" 
                        stroke-dashoffset="0"
                    />
                    <!-- Gradients for standard & high urgency -->
                    <defs>
                        <!-- Normal Standard Blue-Purple Gradient -->
                        <linearGradient id="ringGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#6366f1" />
                            <stop offset="50%" stop-color="#8b5cf6" />
                            <stop offset="100%" stop-color="#ec4899" />
                        </linearGradient>
                        <!-- High Urgency Flame Red Gradient -->
                        <linearGradient id="urgentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#ef4444" />
                            <stop offset="50%" stop-color="#f97316" />
                            <stop offset="100%" stop-color="#facc15" />
                        </linearGradient>
                    </defs>
                </svg>

                <!-- Center Digital Time Text and Sub-info -->
                <div class="absolute inset-0 flex flex-col items-center justify-center text-center p-4">
                    <!-- Displayed Activity Title Banner inside ring -->
                    <div id="displayTitle" class="text-slate-300 font-extrabold text-sm sm:text-lg mb-2 max-w-[260px] truncate px-3 py-1 bg-slate-900/60 rounded-full border border-slate-700/50">
                        🔔 모둠 활동 시간
                    </div>

                    <!-- Huge Digital Clock Text -->
                    <div id="timeDisplay" class="font-digits font-black text-6xl sm:text-7xl md:text-8xl tracking-tight text-white drop-shadow-[0_10px_20px_rgba(0,0,0,0.8)] my-1">
                        05:00
                    </div>

                    <!-- Sub status & percentage -->
                    <div class="flex items-center gap-2 mt-2">
                        <span id="percentageDisplay" class="text-indigo-300 font-bold text-base md:text-lg bg-indigo-950/80 border border-indigo-800/50 px-3 py-0.5 rounded-full">
                            100% 남음
                        </span>
                        <span id="statusBadge" class="text-xs font-semibold px-2.5 py-1 rounded-full bg-slate-800 text-slate-400 border border-slate-700">
                            대기 중
                        </span>
                    </div>
                </div>
            </div>

            <!-- Bottom Quick Time Micro Adjustments (+1분, -30초, +30초) -->
            <div id="quickAdjustBar" class="absolute -bottom-5 flex items-center justify-center gap-2 z-10">
                <button onclick="adjustTime(-30)" class="bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-bold px-3 py-1.5 rounded-full border border-slate-600 shadow-md transition-transform active:scale-95">
                    -30초
                </button>
                <button onclick="adjustTime(30)" class="bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-bold px-3 py-1.5 rounded-full border border-slate-600 shadow-md transition-transform active:scale-95">
                    +30초
                </button>
                <button onclick="adjustTime(60)" class="bg-indigo-900/90 hover:bg-indigo-800 text-indigo-200 text-xs font-bold px-3 py-1.5 rounded-full border border-indigo-600 shadow-md transition-transform active:scale-95">
                    +1분 추가
                </button>
            </div>
        </div>

        <!-- Main Controls (Start, Pause, Reset) -->
        <div class="mt-10 flex flex-wrap items-center justify-center gap-4 z-10 w-full max-w-md">
            <button id="startPauseBtn" class="flex-1 py-4 px-8 bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-400 hover:to-teal-500 text-slate-950 font-black text-xl rounded-2xl shadow-xl shadow-emerald-950/50 flex items-center justify-center gap-3 transition-all transform hover:-translate-y-0.5 active:translate-y-0">
                <i id="startPauseIcon" class="fa-solid fa-play text-2xl"></i>
                <span id="startPauseText">시작하기</span>
            </button>

            <button id="resetBtn" class="py-4 px-6 bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold text-lg rounded-2xl border border-slate-700 shadow-lg flex items-center justify-center gap-2 transition-all active:scale-95">
                <i class="fa-solid fa-rotate-right"></i>
                <span>초기화</span>
            </button>
        </div>

        <!-- Presets & Custom Time Selection Section -->
        <div id="presetsSection" class="mt-8 w-full max-w-2xl glass-panel p-5 rounded-2xl border border-slate-800 text-center">
            <div class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-3">
                <i class="fa-solid fa-clock-rotate-left mr-1"></i> 빠른 시간 선택 (클릭하면 바로 지정)
            </div>
            
            <div class="grid grid-cols-4 sm:grid-cols-7 gap-2 mb-4">
                <button onclick="setPresetTime(60)" class="preset-btn py-2.5 px-2 bg-slate-900/90 hover:bg-indigo-600/40 border border-slate-700 hover:border-indigo-500 rounded-xl font-bold text-sm transition-all">1분</button>
                <button onclick="setPresetTime(180)" class="preset-btn py-2.5 px-2 bg-slate-900/90 hover:bg-indigo-600/40 border border-slate-700 hover:border-indigo-500 rounded-xl font-bold text-sm transition-all">3분</button>
                <button onclick="setPresetTime(300)" class="preset-btn py-2.5 px-2 bg-slate-900/90 hover:bg-indigo-600/40 border border-slate-700 hover:border-indigo-500 rounded-xl font-bold text-sm transition-all">5분</button>
                <button onclick="setPresetTime(600)" class="preset-btn py-2.5 px-2 bg-slate-900/90 hover:bg-indigo-600/40 border border-slate-700 hover:border-indigo-500 rounded-xl font-bold text-sm transition-all">10분</button>
                <button onclick="setPresetTime(900)" class="preset-btn py-2.5 px-2 bg-slate-900/90 hover:bg-indigo-600/40 border border-slate-700 hover:border-indigo-500 rounded-xl font-bold text-sm transition-all">15분</button>
                <button onclick="setPresetTime(1200)" class="preset-btn py-2.5 px-2 bg-slate-900/90 hover:bg-indigo-600/40 border border-slate-700 hover:border-indigo-500 rounded-xl font-bold text-sm transition-all">20분</button>
                <button onclick="setPresetTime(1800)" class="preset-btn py-2.5 px-2 bg-slate-900/90 hover:bg-indigo-600/40 border border-slate-700 hover:border-indigo-500 rounded-xl font-bold text-sm transition-all">30분</button>
            </div>

            <!-- Custom Input Controls -->
            <div class="flex items-center justify-center gap-3 pt-2 border-t border-slate-800">
                <span class="text-xs font-semibold text-slate-400">직접 입력:</span>
                <div class="flex items-center gap-1.5">
                    <input type="number" id="customMin" min="0" max="180" value="5" class="w-16 py-1.5 px-2 bg-slate-900 border border-slate-700 rounded-lg text-center font-bold text-sm text-indigo-300 focus:outline-none focus:border-indigo-500">
                    <span class="text-xs text-slate-400 font-bold">분</span>
                </div>
                <div class="flex items-center gap-1.5">
                    <input type="number" id="customSec" min="0" max="59" value="0" class="w-16 py-1.5 px-2 bg-slate-900 border border-slate-700 rounded-lg text-center font-bold text-sm text-indigo-300 focus:outline-none focus:border-indigo-500">
                    <span class="text-xs text-slate-400 font-bold">초</span>
                </div>
                <button onclick="applyCustomTime()" class="py-1.5 px-4 bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-xs rounded-lg shadow-md transition-all">
                    적용하기
                </button>
            </div>
        </div>
    </main>

    <!-- Time's Up Screen Modal (Hidden by default) -->
    <div id="timesUpModal" class="fixed inset-0 bg-slate-950/90 backdrop-blur-xl z-50 flex items-center justify-center p-4 hidden">
        <div class="glass-panel-dark max-w-lg w-full p-8 rounded-3xl border-2 border-amber-500/60 shadow-[0_0_80px_rgba(245,158,11,0.4)] text-center flex flex-col items-center relative overflow-hidden animate-urgent-beat">
            <!-- Ringing Bell Icon Animation -->
            <div class="w-28 h-28 bg-gradient-to-tr from-amber-500 to-yellow-300 rounded-full flex items-center justify-center text-slate-950 text-5xl mb-6 shadow-xl shadow-amber-500/40 animate-bell-ring">
                <i class="fa-solid fa-bell"></i>
            </div>

            <h2 id="timesUpActivityTitle" class="text-indigo-300 text-lg font-bold mb-1">
                🔔 모둠 활동 및 과제 진행 시간
            </h2>
            <h1 class="text-4xl sm:text-5xl font-black font-title text-white tracking-tight mb-3">
                수업 시간이 완료되었습니다!
            </h1>
            <p class="text-slate-300 text-sm sm:text-base mb-8 font-medium">
                계획한 활동 시간이 모두 지났습니다. 다음 활동을 진행해 주세요!
            </p>

            <div class="flex flex-col sm:flex-row gap-3 w-full">
                <button id="repeatBellBtn" class="flex-1 py-3.5 px-4 bg-amber-500 hover:bg-amber-400 text-slate-950 font-extrabold rounded-xl shadow-lg transition-all flex items-center justify-center gap-2">
                    <i class="fa-solid fa-volume-high"></i>
                    <span>종소리 다시 들려주기</span>
                </button>
                <button id="closeModalBtn" class="flex-1 py-3.5 px-4 bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold rounded-xl border border-slate-700 transition-all">
                    확인 및 닫기
                </button>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="w-full py-3 px-6 text-center text-xs text-slate-500 z-10 border-t border-slate-900/60">
        <span>스마트 교실 수업 타이머 &bull; Web Audio API 고음질 벨 소리 탑재</span>
    </footer>

    <script>
        // Timer state management variables
        let totalSeconds = 300; // Default 5 mins
        let remainingSeconds = 300;
        let timerInterval = null;
        let isRunning = false;
        let isSoundEnabled = true;
        let audioCtx = null;
        let currentThemeIndex = 0; // 0: Dark, 1: Chalkboard, 2: Cyber Blue

        const CIRCLE_CIRCUMFERENCE = 2 * Math.PI * 150; // r=150 -> approx 942.47

        // DOM Element references
        const timeDisplay = document.getElementById('timeDisplay');
        const progressRing = document.getElementById('progressRing');
        const percentageDisplay = document.getElementById('percentageDisplay');
        const statusBadge = document.getElementById('statusBadge');
        const startPauseBtn = document.getElementById('startPauseBtn');
        const startPauseIcon = document.getElementById('startPauseIcon');
        const startPauseText = document.getElementById('startPauseText');
        const resetBtn = document.getElementById('resetBtn');
        const urgentBanner = document.getElementById('urgentBanner');
        const timerCard = document.getElementById('timerCard');
        const mainBody = document.getElementById('mainBody');
        const activityTitleInput = document.getElementById('activityTitle');
        const displayTitle = document.getElementById('displayTitle');
        const timesUpModal = document.getElementById('timesUpModal');
        const timesUpActivityTitle = document.getElementById('timesUpActivityTitle');
        const soundToggleBtn = document.getElementById('soundToggleBtn');
        const soundIcon = document.getElementById('soundIcon');
        const soundLabel = document.getElementById('soundLabel');
        const fullscreenBtn = document.getElementById('fullscreenBtn');
        const fullscreenIcon = document.getElementById('fullscreenIcon');
        const themeBtn = document.getElementById('themeBtn');

        /**
         * Synthesizes a school bell / chime gong sound dynamically using Web Audio API
         */
        function initAudioContext() {
            if (!audioCtx) {
                const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                if (AudioContextClass) {
                    audioCtx = new AudioContextClass();
                }
            }
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playSchoolBellSound() {
            if (!isSoundEnabled) return;
            initAudioContext();
            if (!audioCtx) return;

            const now = audioCtx.currentTime;

            // Harmonious bell frequencies simulating a realistic brass school bell chime
            const bellFrequencies = [523.25, 659.25, 783.99, 1046.50, 1318.51]; 

            bellFrequencies.forEach((freq, idx) => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();

                osc.type = 'sine';
                // Slight detune for realistic bell resonance
                osc.frequency.setValueAtTime(freq + (idx * 2), now);

                // Initial strike envelope
                gain.gain.setValueAtTime(0, now);
                gain.gain.linearRampToValueAtTime(0.25 / (idx + 1), now + 0.05);
                // Long decaying resonance tone
                gain.gain.exponentialRampToValueAtTime(0.0001, now + 3.5);

                osc.connect(gain);
                gain.connect(audioCtx.destination);

                osc.start(now);
                osc.stop(now + 3.6);
            });

            // Second delayed strike chime for standard school bell rhythm (Ding-Dong / Ring)
            setTimeout(() => {
                if (!audioCtx) return;
                const now2 = audioCtx.currentTime;
                bellFrequencies.map(f => f * 1.25).forEach((freq, idx) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, now2);
                    gain.gain.setValueAtTime(0, now2);
                    gain.gain.linearRampToValueAtTime(0.3 / (idx + 1), now2 + 0.04);
                    gain.gain.exponentialRampToValueAtTime(0.0001, now2 + 4.0);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now2);
                    osc.stop(now2 + 4.1);
                });
            }, 600);
        }

        // Soft tick sound for ticking clock beat under 60 seconds
        function playTickSound() {
            if (!isSoundEnabled) return;
            initAudioContext();
            if (!audioCtx) return;

            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            osc.type = 'triangle';
            osc.frequency.setValueAtTime(1200, now);
            osc.frequency.exponentialRampToValueAtTime(400, now + 0.03);

            gain.gain.setValueAtTime(0.08, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.03);

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start(now);
            osc.stop(now + 0.035);
        }

        /**
         * Formats seconds into MM:SS display format
         */
        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = seconds % 60;
            return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
        }

        /**
         * Updates UI elements, circular progress ring, and 1-minute alert visual state
         */
        function updateDisplay() {
            // Update time digits text
            timeDisplay.textContent = formatTime(remainingSeconds);

            // Calculate progress percentage
            const percentage = totalSeconds > 0 ? (remainingSeconds / totalSeconds) : 0;
            const offset = CIRCLE_CIRCUMFERENCE * (1 - percentage);
            progressRing.style.strokeDashoffset = offset;

            const roundedPercent = Math.round(percentage * 100);
            percentageDisplay.textContent = `${roundedPercent}% 남음`;

            // Update Activity Title in center display
            const currentTitle = activityTitleInput.value.trim() || "수업 타이머";
            displayTitle.textContent = currentTitle;

            // Visual Check: Under 1 Minute Special Effects Trigger (< 60 seconds and active)
            if (remainingSeconds <= 60 && remainingSeconds > 0 && isRunning) {
                enableUrgentEffects();
            } else {
                disableUrgentEffects();
            }
        }

        /**
         * Activates high-impact glowing & energetic animations when remaining time < 1 minute
         */
        function enableUrgentEffects() {
            urgentBanner.classList.remove('hidden');
            timerCard.classList.add('animate-pulse-glow', 'border-red-500/80');
            progressRing.setAttribute('stroke', 'url(#urgentGradient)');
            timeDisplay.classList.add('text-red-400', 'scale-105');
            mainBody.classList.add('animate-warning-bg');
            statusBadge.textContent = "⚡ 마감 임박 (1분 미만)";
            statusBadge.className = "text-xs font-black px-3 py-1 rounded-full bg-red-950 text-red-300 border border-red-600 animate-pulse";
        }

        /**
         * Clears high urgency effects back to normal theme styling
         */
        function disableUrgentEffects() {
            urgentBanner.classList.add('hidden');
            timerCard.classList.remove('animate-pulse-glow', 'border-red-500/80');
            progressRing.setAttribute('stroke', 'url(#ringGradient)');
            timeDisplay.classList.remove('text-red-400', 'scale-105');
            mainBody.classList.remove('animate-warning-bg');

            if (isRunning) {
                statusBadge.textContent = "진행 중";
                statusBadge.className = "text-xs font-semibold px-2.5 py-1 rounded-full bg-emerald-950 text-emerald-300 border border-emerald-700";
            } else if (remainingSeconds === 0) {
                statusBadge.textContent = "종료됨";
                statusBadge.className = "text-xs font-semibold px-2.5 py-1 rounded-full bg-amber-950 text-amber-300 border border-amber-700";
            } else {
                statusBadge.textContent = "대기 중";
                statusBadge.className = "text-xs font-semibold px-2.5 py-1 rounded-full bg-slate-800 text-slate-400 border border-slate-700";
            }
        }

        function startTimer() {
            initAudioContext();
            if (remainingSeconds <= 0) return;

            isRunning = true;
            startPauseIcon.className = 'fa-solid fa-pause text-2xl';
            startPauseText.textContent = '일시 정지';
            startPauseBtn.className = 'flex-1 py-4 px-8 bg-amber-500 hover:bg-amber-400 text-slate-950 font-black text-xl rounded-2xl shadow-xl shadow-amber-950/50 flex items-center justify-center gap-3 transition-all active:scale-95';

            timerInterval = setInterval(() => {
                if (remainingSeconds > 0) {
                    remainingSeconds--;
                    
                    // Soft tick sound during last 60 seconds
                    if (remainingSeconds <= 60 && remainingSeconds > 0) {
                        playTickSound();
                    }

                    updateDisplay();
                } else {
                    // Time's Up!
                    onTimerFinished();
                }
            }, 1000);

            updateDisplay();
        }

        function pauseTimer() {
            isRunning = false;
            clearInterval(timerInterval);
            startPauseIcon.className = 'fa-solid fa-play text-2xl';
            startPauseText.textContent = '다시 시작';
            startPauseBtn.className = 'flex-1 py-4 px-8 bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-400 hover:to-teal-500 text-slate-950 font-black text-xl rounded-2xl shadow-xl shadow-emerald-950/50 flex items-center justify-center gap-3 transition-all active:scale-95';
            updateDisplay();
        }

        function resetTimer() {
            pauseTimer();
            remainingSeconds = totalSeconds;
            startPauseText.textContent = '시작하기';
            updateDisplay();
        }

        function adjustTime(secondsToAdd) {
            remainingSeconds = Math.max(0, remainingSeconds + secondsToAdd);
            if (remainingSeconds > totalSeconds) {
                totalSeconds = remainingSeconds;
            }
            updateDisplay();
        }

        function setPresetTime(seconds) {
            pauseTimer();
            totalSeconds = seconds;
            remainingSeconds = seconds;
            startPauseText.textContent = '시작하기';
            updateDisplay();
        }

        function applyCustomTime() {
            const min = parseInt(document.getElementById('customMin').value) || 0;
            const sec = parseInt(document.getElementById('customSec').value) || 0;
            const calculatedTotal = (min * 60) + sec;

            if (calculatedTotal > 0) {
                setPresetTime(calculatedTotal);
            }
        }

        function onTimerFinished() {
            pauseTimer();
            disableUrgentEffects();
            playSchoolBellSound();

            // Display completion modal overlay
            timesUpActivityTitle.textContent = activityTitleInput.value.trim() || "수업 타이머";
            timesUpModal.classList.remove('hidden');
        }

        // Event Listeners setup
        startPauseBtn.addEventListener('click', () => {
            if (isRunning) {
                pauseTimer();
            } else {
                startTimer();
            }
        });

        resetBtn.addEventListener('click', resetTimer);

        document.getElementById('repeatBellBtn').addEventListener('click', () => {
            playSchoolBellSound();
        });

        document.getElementById('closeModalBtn').addEventListener('click', () => {
            timesUpModal.classList.add('hidden');
        });

        activityTitleInput.addEventListener('input', () => {
            displayTitle.textContent = activityTitleInput.value.trim() || "수업 타이머";
        });

        // Sound Mute/Unmute Toggle
        soundToggleBtn.addEventListener('click', () => {
            isSoundEnabled = !isSoundEnabled;
            if (isSoundEnabled) {
                soundIcon.className = 'fa-solid fa-volume-high';
                soundLabel.textContent = '소리 켜짐';
                soundToggleBtn.className = 'p-2.5 bg-slate-800/80 hover:bg-slate-700 border border-slate-700 rounded-xl text-emerald-400 transition-all flex items-center gap-1.5 px-3';
                playTickSound(); // subtle audio confirmation
            } else {
                soundIcon.className = 'fa-solid fa-volume-xmark';
                soundLabel.textContent = '음소거';
                soundToggleBtn.className = 'p-2.5 bg-slate-800/80 hover:bg-slate-700 border border-slate-700 rounded-xl text-rose-400 transition-all flex items-center gap-1.5 px-3';
            }
        });

        // Fullscreen Toggle for classroom projectors
        fullscreenBtn.addEventListener('click', () => {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    console.log("Fullscreen request error:", err);
                });
                fullscreenIcon.className = 'fa-solid fa-compress';
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
                fullscreenIcon.className = 'fa-solid fa-expand';
            }
        });

        // Background Theme Switcher
        const themes = ['bg-slate-950', 'chalkboard-bg', 'bg-gradient-to-br from-gray-900 via-indigo-950 to-slate-900'];
        themeBtn.addEventListener('click', () => {
            mainBody.classList.remove(themes[currentThemeIndex]);
            currentThemeIndex = (currentThemeIndex + 1) % themes.length;
            mainBody.classList.add(themes[currentThemeIndex]);
        });

        // Initial setup on load
        window.addEventListener('load', () => {
            progressRing.style.strokeDasharray = `${CIRCLE_CIRCUMFERENCE}`;
            updateDisplay();
        });
    </script>
</body>
</html>
